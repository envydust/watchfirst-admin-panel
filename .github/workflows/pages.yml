name: Publicar painel (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_BASE: /watchfirst-admin-panel/
          VITE_API_ORIGIN: ${{ vars.API_ORIGIN || 'https://acesso.watchfirst.com.br' }}
      # Pushes dist/ to the gh-pages branch directly. Actions artifact storage is not used on purpose:
      # the account's artifact quota is full, and Pages can serve a branch without any artifact.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publicar painel ${{ github.sha }}'
